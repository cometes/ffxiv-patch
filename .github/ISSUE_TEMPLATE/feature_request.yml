name: "기능 제안"
description: "새 기능, 옵션 또는 사용성 개선을 제안할 때 작성해주세요."
title: "[기능 제안] 예: 특정 문구를 원문으로 유지하는 옵션이 필요합니다"
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        제안해주셔서 감사합니다.

        위 제목의 `예:` 문구를 지우고 **추가했으면 하는 기능을 한 줄로** 바꿔주세요.
        좋은 제목 예시: `[기능 제안] 지역명만 원문으로 유지하는 옵션이 필요합니다`

  - type: checkboxes
    id: existing_issue
    attributes:
      label: "기존 이슈 확인"
      description: "같거나 비슷한 제안이 이미 등록되어 있는지 먼저 검색해주세요."
      options:
        - label: "열린 이슈와 닫힌 이슈에서 비슷한 제안을 검색했습니다."
          required: true

  - type: dropdown
    id: feature_area
    attributes:
      label: "제안 분야"
      description: "가장 가까운 항목을 선택해주세요."
      options:
        - "번역 또는 원문 유지 옵션"
        - "글꼴 또는 화면 표시"
        - "패처 UI 또는 사용성"
        - "패치 생성 또는 적용"
        - "백업, 복구 또는 패치 제거"
        - "지원 언어 또는 클라이언트"
        - "문서 또는 안내"
        - "기타"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "어떤 점이 불편한가요?"
      description: "기능이 없어서 현재 겪는 문제나 반복 작업을 설명해주세요."
      placeholder: |
        예: 전체 패치를 사용하면 지역명도 한국어로 바뀌어서 일본어 공략과 대조하기 어렵습니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "원하는 기능"
      description: "어디에 어떤 옵션이나 동작이 추가되면 좋은지 구체적으로 적어주세요."
      placeholder: |
        예: 원문 유지 항목에 '지역명' 옵션을 추가하고, 켜면 PlaceName만 베이스 언어로 유지해주세요.
    validations:
      required: true

  - type: textarea
    id: usage_flow
    attributes:
      label: "사용 예시"
      description: "기능이 추가됐을 때 사용자가 어떤 순서로 쓰게 되는지 적어주세요."
      placeholder: |
        1. 패처를 실행합니다.
        2. 원문 유지에서 원하는 항목을 선택합니다.
        3. 전체 한글 패치를 실행합니다.
        4. 선택한 항목만 원문으로 표시됩니다.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "현재 사용 중인 대안"
      description: "임시로 해결하는 방법이나 검토해본 다른 방식이 있다면 적어주세요."
      placeholder: "없다면 '없음'이라고 적어도 됩니다."

  - type: textarea
    id: references
    attributes:
      label: "참고 자료"
      description: "비슷한 기능의 링크, 화면 예시 또는 스크린샷을 첨부해주세요."

  - type: checkboxes
    id: final_check
    attributes:
      label: "마지막 확인"
      options:
        - label: "제목의 예시 문구를 실제 제안을 설명하는 제목으로 바꿨습니다."
          required: true
        - label: "요청하는 기능과 필요한 이유를 함께 작성했습니다."
          required: true
